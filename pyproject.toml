[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "SeedShield"
dynamic = ["version"]
readme = { file = "README.md", content-type = "text/markdown" }
description = "Secure BIP39 word viewer with masking and reveal functionality"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Barlog951", email = "barlog951@gmail.com"}
]
requires-python = ">=3.10"
dependencies = [
    "pyperclip>=1.11.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]

[project.urls]
"Documentation" = "https://github.com/Barlog951/SeedShield/blob/main/README.md"
"Source Code" = "https://github.com/Barlog951/SeedShield"
"Bug Tracker" = "https://github.com/Barlog951/SeedShield/issues"

[project.optional-dependencies]
test = [
    "pytest>=9.1",
    "pytest-timeout>=2.4",
    "pytest-cov>=7.1",
    "pylint>=4.0.9",
    "flake8>=7.4",
    "mypy>=2.3"
]
windows = ["windows-curses>=2.4.2"]
dev = [
    "build>=1.6",
    "twine>=7.0",
    "black>=26.5"
]

[project.scripts]
seedshield = "seedshield.main:main"

[tool.setuptools.packages.find]
# Namespace discovery so the data/ directory ships as package data
include = ["seedshield", "seedshield.*"]
exclude = ["*.__pycache__"]

[tool.setuptools.package-data]
seedshield = ["data/english.txt"]

[tool.setuptools.dynamic]
# Single source of truth for the version; semantic-release updates config.py
version = {attr = "seedshield.config.VERSION"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "timeout: mark test with timeout value in seconds"
]

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
]

[tool.mypy]
# Type-check against the supported floor
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

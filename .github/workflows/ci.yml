name: CI/CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        type: choice
        required: true
        default: 'production'
        options:
        - production
        - staging
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday

permissions:
  contents: read
  pull-requests: read
  issues: write
  packages: write
  deployments: write

jobs:
  test:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        # 3.10 = supported floor, 3.12 = primary, 3.14 = Docker runtime
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install build pytest-cov pylint flake8 mypy

      - name: Run tests
        run: pytest -v --junitxml=report.xml

      - name: Run coverage
        if: matrix.python-version == '3.12'
        run: |
          pytest --cov=seedshield --cov-report term-missing --cov-report xml:coverage.xml --junitxml=junit.xml -o junit_family=legacy
          coverage report --fail-under=85

      - name: Quality checks
        if: matrix.python-version == '3.12'
        run: |
          pylint seedshield || exit $(( $? & 35 ))
          flake8 seedshield
          mypy seedshield

      - name: Upload coverage reports
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # codecov/test-results-action is deprecated in favor of report_type
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.python-version == '3.12' }}
        uses: codecov/codecov-action@v7
        with:
          report_type: test_results
          files: ./junit.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  dependency-review:
    runs-on: ubuntu-26.04
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  security-scan:
    needs: test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    # Weekly schedule re-scans dependencies even when nothing was pushed
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      # Basic security checks
      - uses: pyupio/safety-action@v1
        with:
          api-key: ${{ secrets.SAFETY_API_KEY }}

  release:
    needs: [test, security-scan]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
    # Push only: scheduled/manual runs on main must never cut a release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      new-version: ${{ steps.get_new_version.outputs.NEW_VERSION }}
      released: ${{ steps.get_new_version.outputs.RELEASED }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: |
          npm install -g semantic-release
          npm install -g @semantic-release/exec
          npm install -g @semantic-release/git
          npm install -g @semantic-release/changelog

      - name: Check and create initial tag
        run: |
          if [ -z "$(git tag)" ]; then
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git config --global user.name "github-actions[bot]"
            git tag -a v0.0.1 -m "Initial release"
            git push origin v0.0.1
          fi

      - name: Record latest tag before release
        run: echo "PREVIOUS_TAG=$(git describe --tags --abbrev=0)" >> "$GITHUB_ENV"

      - name: Release
        id: semantic_release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: npx semantic-release

      - name: Get new version
        id: get_new_version
        run: |
          VERSION=$(git describe --tags --abbrev=0)
          echo "NEW_VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          # Publish only when semantic-release actually created a new tag
          if [ "$VERSION" != "$PREVIOUS_TAG" ]; then
            echo "RELEASED=true" >> "$GITHUB_OUTPUT"
          else
            echo "RELEASED=false" >> "$GITHUB_OUTPUT"
          fi

  build-package:
    needs: [release, security-scan]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    if: needs.release.outputs.released == 'true'
    steps:
      - name: Print new version
        run: echo "Version is ${{ needs.release.outputs.new-version }}"

      - uses: actions/checkout@v7
        with:
          ref: "refs/tags/${{ needs.release.outputs.new-version }}"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build & twine
        run: pip install --upgrade pip build twine

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # Re-running a failed release job must not fail on files already uploaded
          skip-existing: true

  build-docker:
    needs: [release, security-scan]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    if: needs.release.outputs.released == 'true'
    steps:
      - name: Print new version
        run: echo "Version is ${{ needs.release.outputs.new-version }}"

      - uses: actions/checkout@v7
        with:
          ref: "refs/tags/${{ needs.release.outputs.new-version }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get version from seedshield/config.py
        run: |
          VERSION=$(grep -o 'VERSION = "[0-9.]*"' seedshield/config.py | grep -o '[0-9.]*')
          echo "PACKAGE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/seedshield:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/seedshield:${{ env.PACKAGE_VERSION }}

  vulnerabilities-notification:
    needs: [security-scan]
    runs-on: ubuntu-26.04
    permissions:
      issues: write
      contents: read
    # Only a failed scan opens this issue; failure() would also fire on test failures
    if: always() && needs.security-scan.result == 'failure' && (github.event_name == 'schedule' || github.event_name == 'push')
    steps:
      - name: Create Issue
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Security Vulnerabilities Found',
              body: 'Security vulnerabilities were found during the scan. Please check the latest workflow run for details.',
              labels: ['security', 'vulnerability']
            })
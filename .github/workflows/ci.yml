name: CI/CD

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday

# Least privilege by default; jobs request what they need
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        # 3.10 = supported floor, 3.12 = primary, 3.14 = Docker runtime
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install build pytest-cov pylint flake8 mypy

      - name: Run tests
        run: pytest -v --junitxml=report.xml

      - name: Run coverage
        if: matrix.python-version == '3.12'
        run: |
          pytest --cov=seedshield --cov-report term-missing --cov-report xml:coverage.xml --junitxml=junit.xml -o junit_family=legacy
          coverage report --fail-under=85

      - name: Quality checks
        if: matrix.python-version == '3.12'
        run: |
          pylint seedshield || exit $(( $? & 35 ))
          flake8 seedshield
          mypy seedshield

      - name: Upload coverage reports
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # codecov/test-results-action is deprecated in favor of report_type
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.python-version == '3.12' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          files: ./junit.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-macos:
    # The pty end-to-end tests also cover macOS ncurses (X10 mouse encoding)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests
        run: pytest -v

  dependency-review:
    runs-on: ubuntu-26.04
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  security-scan:
    needs: test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    # Weekly schedule re-scans dependencies even when nothing was pushed
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      # Basic security checks
      - uses: pyupio/safety-action@2591cf2f3e67ba68b923f4c92f0d36e281c65023 # v1.0.1
        with:
          api-key: ${{ secrets.SAFETY_API_KEY }}

  release:
    needs: [test, test-macos, security-scan]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
    # Push only: scheduled/manual runs on main must never cut a release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      new-version: ${{ steps.get_new_version.outputs.NEW_VERSION }}
      released: ${{ steps.get_new_version.outputs.RELEASED }}
    steps:
      # Default GITHUB_TOKEN pushes the release commit/tag; this needs main to
      # stay unprotected (or a bypass for github-actions) if protection is added
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: |
          # Majors pinned so a new major can't silently change release behavior
          npm install -g semantic-release@25 @semantic-release/exec@7 \
            @semantic-release/git@11 @semantic-release/changelog@7

      - name: Record latest tag before release
        run: echo "PREVIOUS_TAG=$(git describe --tags --abbrev=0)" >> "$GITHUB_ENV"

      - name: Release
        id: semantic_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Get new version
        id: get_new_version
        run: |
          VERSION=$(git describe --tags --abbrev=0)
          echo "NEW_VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          # Publish only when semantic-release actually created a new tag
          if [ "$VERSION" != "$PREVIOUS_TAG" ]; then
            echo "RELEASED=true" >> "$GITHUB_OUTPUT"
          else
            echo "RELEASED=false" >> "$GITHUB_OUTPUT"
          fi

  build-package:
    needs: [release, security-scan]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    if: needs.release.outputs.released == 'true'
    steps:
      - name: Print new version
        run: echo "Version is ${{ needs.release.outputs.new-version }}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "refs/tags/${{ needs.release.outputs.new-version }}"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install build & twine
        run: pip install --upgrade pip build twine

      - name: Build package
        run: python -m build

      # Trusted publishing (OIDC via id-token: write); no stored PyPI token
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # Re-running a failed release job must not fail on files already uploaded
          skip-existing: true

  build-docker:
    needs: [release, security-scan]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    if: needs.release.outputs.released == 'true'
    steps:
      - name: Print new version
        run: echo "Version is ${{ needs.release.outputs.new-version }}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "refs/tags/${{ needs.release.outputs.new-version }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get version from seedshield/config.py
        run: |
          VERSION=$(grep -o 'VERSION = "[0-9.]*"' seedshield/config.py | grep -o '[0-9.]*')
          echo "PACKAGE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/seedshield:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/seedshield:${{ env.PACKAGE_VERSION }}

  vulnerabilities-notification:
    needs: [security-scan]
    runs-on: ubuntu-26.04
    permissions:
      issues: write
      contents: read
    # Only a failed scan opens this issue; failure() would also fire on test failures
    if: always() && needs.security-scan.result == 'failure' && (github.event_name == 'schedule' || github.event_name == 'push')
    steps:
      - name: Create Issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Security Vulnerabilities Found',
              body: 'Security vulnerabilities were found during the scan. Please check the latest workflow run for details.',
              labels: ['security', 'vulnerability']
            })